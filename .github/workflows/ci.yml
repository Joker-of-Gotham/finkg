name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # skill 本身零依赖；PyYAML 只给校验用，让 frontmatter 走一次真 YAML 解析。
      # 未加引号的标量里出现 "Keywords: " 这类写法会被宿主判为嵌套映射并跳过整个 skill，
      # 只有真解析才能可靠拦住。
      - name: 安装校验用依赖
        run: python -m pip install --quiet pyyaml

      - name: 校验 SKILL.md 规范与脚本编译
        run: python install.py --check

      - name: 离线单测
        run: python tests/test_finkg.py

      - name: 安装到临时目录并验证可用
        shell: bash
        run: |
          python install.py --agent agents --project --project-root "$RUNNER_TEMP" --force
          python "$RUNNER_TEMP/.agents/skills/finkg/scripts/fg.py" --help
          python "$RUNNER_TEMP/.agents/skills/finkg/scripts/fg.py" template entity \
            --output "$RUNNER_TEMP/entity.json"
          python -c "import json;json.load(open(r'$RUNNER_TEMP/entity.json',encoding='utf-8'))"

      - name: 卸载后不留残留
        shell: bash
        run: |
          python install.py --agent agents --project --project-root "$RUNNER_TEMP" --uninstall
          test ! -d "$RUNNER_TEMP/.agents/skills/finkg"

  no-deployment-specifics:
    name: 不含部署信息
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 确认没有提交本地配置、环境档案与会话数据
        run: |
          set -e
          for path in financial_graph.local.json finkg.environment.md \
                      financial-graph-sessions .financial-graph-sessions; do
            if git ls-files --error-unmatch "$path" > /dev/null 2>&1; then
              echo "::error::$path 不应被提交"; exit 1
            fi
          done

      - name: 默认配置里不应出现任何部署项
        run: |
          set -e
          for key in neo4j_password neo4j_url neo4j_user lazysearch_url; do
            if grep -q "\"$key\"" skills/finkg/fg.defaults.json; then
              echo "::error::fg.defaults.json 里不能有 $key"; exit 1
            fi
          done

      # 主机、IP、凭据、内部数仓库表名的全仓库扫描，规则见测试里的 PATTERNS
      - name: 全仓库泄露扫描
        run: python -m unittest tests.test_finkg.TestNoDeploymentSpecifics -v
